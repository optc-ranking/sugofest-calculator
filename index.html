<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPTC Sugofest Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="home.css?v=20260508-high-value-filter">
</head>
<body>
    <header class="app-header">
        <div>
            <h1>OPTC Sugofest Calculator</h1>
        </div>
        <nav class="header-actions" aria-label="Advanced tools">
            <a class="secondary-link" id="advancedInputLink" href="detailed-input.html?autoLoadLast=true">Detailed Input</a>
            <a class="primary-link" id="advancedAnalyticsLink" href="results.html">Detailed Analytics</a>
        </nav>
    </header>

    <main class="home-shell">
        <section class="banner-overview" aria-labelledby="infographicTitle">
            <div class="overview-toolbar">
                <label class="setup-picker" for="setupSelect">
                    <span>Setup</span>
                    <select id="setupSelect"></select>
                </label>
            </div>

            <div class="banner-heading">
                <h2 id="infographicTitle">INFOGRAPHIC</h2>
            </div>

            <figure class="infographic-frame">
                <button type="button" class="infographic-open" id="infographicOpenBtn" aria-label="Open infographic viewer">
                    <img id="infographicImage" alt="Sugofest infographic">
                </button>
                <div class="empty-infographic" id="emptyInfographic">No infographic</div>
            </figure>
        </section>

        <section class="graph-panel" aria-labelledby="overviewGraphTitle">
            <div class="graph-header">
                <div>
                    <h2 id="overviewGraphTitle">Graph</h2>
                </div>
                <div class="metric-toggle" aria-label="Graph metric">
                    <button type="button" class="metric-btn active" data-metric="normalizedRate">Normalized Rate</button>
                    <button type="button" class="metric-btn" data-metric="probPullAtLeastOne">Cumulative Chance</button>
                    <button type="button" class="metric-btn" data-metric="probSuccessOnThisMultiOnly">High Value Multis</button>
                </div>
            </div>
            <div class="high-value-filter" id="highValueFilter" hidden>
                <span>Show</span>
                <div class="part-toggle" aria-label="High Value Multis banner filter">
                    <button type="button" class="part-filter-btn active" data-part-filter="both">Both</button>
                    <button type="button" class="part-filter-btn" data-part-filter="part1">Part 1</button>
                    <button type="button" class="part-filter-btn" data-part-filter="part2-6">Part 2-6</button>
                </div>
            </div>

            <div class="chart-wrap">
                <canvas id="overviewChart"></canvas>
            </div>
            <div class="overview-legend" id="overviewLegend"></div>
        </section>

        <section class="heatmap-panel" aria-labelledby="overviewHeatmapTitle">
            <div class="graph-header">
                <div>
                    <h2 id="overviewHeatmapTitle">Average Gems Heat Maps</h2>
                </div>
            </div>
            <div id="overviewHeatmapContainer" class="heatmap-container"></div>
        </section>
    </main>

    <div class="image-viewer" id="imageViewer" aria-hidden="true">
        <div class="viewer-toolbar">
            <button type="button" id="zoomOutBtn">-</button>
            <button type="button" id="zoomResetBtn">100%</button>
            <button type="button" id="zoomInBtn">+</button>
            <button type="button" id="closeViewerBtn">Close</button>
        </div>
        <div class="viewer-stage" id="viewerStage">
            <img id="viewerImage" alt="Sugofest infographic full view">
        </div>
    </div>

    <script src="home.js?v=20260509-heatmap-green-threshold"></script>
</body>
</html>
