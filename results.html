<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugofest Calculation Results</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="results_style.css?v=20260508-checklist-columns-zoom">
</head>
<body>
    <header class="app-header">
        <h1>Sugofest Analysis Results</h1>
        <nav class="header-actions" aria-label="Page navigation">
            <a href="index.html" id="backToEntryLink" class="secondary-link">Overview</a>
            <a href="detailed-input.html?autoLoadLast=true" class="primary-link">Detailed Input</a>
        </nav>
    </header>

    <main>
        <div class="results-controls card">
            <label for="rateTypeSelect">Metric</label>
            <select id="rateTypeSelect">
                <option value="normalizedRate" selected>Normalized Rate</option>
                <option value="probPullAtLeastOne">Cumulative Pull Chance</option>
                <option value="probSuccessOnThisMultiOnly">High Value Multis</option>
                <option value="evHeatMap">Average Gems Heat Map</option>
            </select>
        </div>

        <div id="checklistContainerParent" class="card">
             <div class="checklist-header">
                <h3>Banners & Analyses</h3>
                <div class="checklist-bulk-controls">
                    <button id="selectAllBtn" class="utility-button utility-button-small">Select All</button>
                    <button id="deselectAllBtn" class="utility-button utility-button-small">Deselect All</button>
                </div>
             </div>
             <!-- Checklist sections per banner will be dynamically added here -->
        </div>

        <div id="chartContainerOuter" class="card">
            <div class="chart-card-header">
                <h3>Graph</h3>
                <div class="chart-zoom-controls" id="chartZoomControls">
                    <button type="button" id="zoomOutBtn" class="utility-button utility-button-small">Zoom Out</button>
                    <button type="button" id="zoomResetBtn" class="utility-button utility-button-small">Reset</button>
                    <button type="button" id="zoomInBtn" class="utility-button utility-button-small">Zoom In</button>
                </div>
            </div>
            <div id="chartContainer">
                 <canvas id="resultsChart"></canvas>
                 <div id="heatmapContainer" class="heatmap-container" hidden></div>
            </div>
        </div>

        <div class="card download-section">
            <h3>CSV</h3>
            <button id="downloadDetailCsvBtn" class="utility-button">Download Detailed EV Analysis (.csv)</button>
            <button id="downloadGraphCsvBtn" class="utility-button">Download Graph Data (.csv)</button>
        </div>
    </main>

    <script src="results.js?v=20260508-y-axis-zoom"></script>
</body>
</html>
